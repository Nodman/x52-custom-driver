name: Build

on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['v*']   # a pushed tag vX.Y.Z also publishes a release
    # A push to master publishes release vX.Y.Z (from VERSION) if it doesn't exist yet

permissions:
  contents: write  # needed to create releases

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          "VERSION=$v" >> $env:GITHUB_ENV
          Write-Host "Version $v"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish app
        run: dotnet publish X52.CustomDriver.App -c Release -r win-x64 --self-contained false

      - name: Publish diagnostics console
        run: dotnet publish X52.CustomDriver.Console -c Release -r win-x64 --self-contained false

      - name: Check the exe has the VERSION file's version
        shell: pwsh
        run: |
          $exe = "X52.CustomDriver.App/bin/Release/net9.0-windows/win-x64/publish/X52.CustomDriver.App.exe"
          $pv = (Get-Item $exe).VersionInfo.ProductVersion
          if (-not $pv.StartsWith($env:VERSION)) { throw "exe version $pv does not match VERSION $env:VERSION" }
          Write-Host "exe version $pv OK"

      - name: Put vJoyInterface.dll next to the exe
        shell: pwsh
        run: |
          $p = "X52.CustomDriver.App/bin/Release/net9.0-windows/win-x64/publish"
          if (Test-Path "$p/x64/vJoyInterface.dll") { Copy-Item "$p/x64/vJoyInterface.dll" $p -Force }

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc setup.iss

      - uses: actions/upload-artifact@v4
        with:
          name: AerakonX52-portable-v${{ env.VERSION }}
          path: X52.CustomDriver.App/bin/Release/net9.0-windows/win-x64/publish

      - uses: actions/upload-artifact@v4
        with:
          name: AerakonX52-installer-v${{ env.VERSION }}
          path: InstallerOutput/*.exe
          if-no-files-found: error

      # ---------------- Release (only for version tags) ----------------

      - name: Decide whether to publish a release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = $false
          if ("${{ github.ref }}".StartsWith("refs/tags/v")) {
            # Manual tag push: the tag must match VERSION
            if ("${{ github.ref_name }}" -ne "v$env:VERSION") { throw "Tag ${{ github.ref_name }} does not match VERSION ($env:VERSION)" }
            $release = $true
          }
          elseif ("${{ github.ref }}" -eq "refs/heads/master") {
            # Push to master: release automatically when this VERSION has no release yet
            gh release view "v$env:VERSION" --repo "${{ github.repository }}" *> $null
            if ($LASTEXITCODE -ne 0) { $release = $true }
            $global:LASTEXITCODE = 0
          }
          "RELEASE=$($release.ToString().ToLower())" >> $env:GITHUB_ENV
          Write-Host "Publish release v$($env:VERSION): $release"

      - name: Package release files
        if: env.RELEASE == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item "InstallerOutput/AerakonX52Driver_Setup_v$env:VERSION.exe" release/
          Compress-Archive -Path "X52.CustomDriver.App/bin/Release/net9.0-windows/win-x64/publish/*" `
                           -DestinationPath "release/AerakonX52Driver_v$($env:VERSION)_portable.zip"
          Get-ChildItem release -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content release/SHA256SUMS.txt -Encoding ascii
          Get-Content release/SHA256SUMS.txt

          # Release notes = this version's section of CHANGELOG.md
          $text = Get-Content CHANGELOG.md -Raw
          $pattern = '(?ms)^## v' + [regex]::Escape($env:VERSION) + '\s*$(.*?)(?=^## v|\z)'
          $m = [regex]::Match($text, $pattern)
          if (-not $m.Success) { throw "No '## v$env:VERSION' section in CHANGELOG.md" }
          $notes = $m.Groups[1].Value.Trim() + "`n`n---`n**Downloads**`n" +
                   "- ``AerakonX52Driver_Setup_v$env:VERSION.exe`` – installer (recommended)`n" +
                   "- ``AerakonX52Driver_v$($env:VERSION)_portable.zip`` – no install: unzip anywhere and run ``X52.CustomDriver.App.exe```n" +
                   "- ``SHA256SUMS.txt`` – checksums`n`n" +
                   "Built by GitHub Actions from commit ${{ github.sha }}."
          Set-Content release/notes.md $notes -Encoding utf8

      - name: Publish GitHub Release
        if: env.RELEASE == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Creates the tag on this commit if it doesn't exist yet
          gh release create "v$env:VERSION" --target "${{ github.sha }}" `
            "release/AerakonX52Driver_Setup_v$env:VERSION.exe" `
            "release/AerakonX52Driver_v$($env:VERSION)_portable.zip" `
            "release/SHA256SUMS.txt" `
            --title "Ærakon X52 driver v$env:VERSION (community fork)" `
            --notes-file release/notes.md `
            --latest

